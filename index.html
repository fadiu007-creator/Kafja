<!doctype html>
<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f4e37"><title>Kafja — Kafeteritë me kafe & ujë</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div class="brand"><span class="cup">☕</span><div><h1>Kafja</h1><p>Gjej kafenë. Shiko çmimin. A ka ujë?</p></div></div><button id="addTop" class="primary">＋ Shto lokal</button></header>
<main><section class="hero"><span class="eyebrow">Komuniteti i kafes</span><h2>Kafeteritë, çmimet dhe uji — në një vend.</h2><p>Shiko ku kushton kafeja më pak dhe nëse të sjellin ujë.</p></section>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="Kërko lokal ose qytet…"></label><div class="filters"><button class="filter active" data-water="all">Të gjitha</button><button class="filter" data-water="yes">💧 Me ujë</button><button class="filter" data-water="no">Pa ujë</button></div><select id="sort"><option value="new">Të rejat</option><option value="low">Çmimi: i ulët → i lartë</option><option value="high">Çmimi: i lartë → i ulët</option><option value="name">Emri A–Z</option></select></section>
<section id="stats" class="stats"></section><section id="list" class="grid"></section><div id="empty" class="empty hidden"><div>☕</div><h3>Nuk u gjet asnjë lokal</h3><p>Provo një kërkim tjetër ose shto një lokal të ri.</p></div></main>
<div id="modal" class="modal hidden"><div class="backdrop" data-close></div><form id="form" class="dialog"><button type="button" class="close" data-close>×</button><span class="eyebrow">Shto në Kafja</span><h2>Një lokal i ri</h2>
<label>Emri i lokalit<input required name="name" maxlength="80" placeholder="p.sh. Café X"></label><label>Qyteti<input required name="city" maxlength="60" placeholder="p.sh. Ferizaj"></label><label>Çmimi i kafesë (€)<input required name="price" type="number" min="0" step="0.01" placeholder="1.00"></label>
<fieldset><legend>A shërbehet ujë?</legend><label class="radio"><input required type="radio" name="water" value="yes"> Po, me ujë</label><label class="radio"><input type="radio" name="water" value="no"> Jo</label></fieldset>
<label>Shënim <span class="muted">(opsionale)</span><textarea name="note" maxlength="180" placeholder="p.sh. ujë mineral, gotë e vogël…"></textarea></label><button class="primary wide" type="submit">Shto lokalin</button></form></div><div id="toast" class="toast"></div><script src="supabase.js"></script><script src="app.js"></script></body></html>
